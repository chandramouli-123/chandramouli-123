<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#140f2d"/>
      <stop offset="100%" stop-color="#1f1147"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="280" rx="16" fill="url(#bg)" stroke="#2e1065" stroke-width="2"/>
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#c084fc" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="500" y1="0" x2="500" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="700" y1="0" x2="700" y2="280"/>
  </g>

  <!-- Glowing Shield / Sentinel Icon -->
  <g transform="translate(70, 75)">
    <!-- Outer Glow Circle -->
    <circle cx="65" cy="65" r="55" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
    <circle cx="65" cy="65" r="45" fill="#0f0926" stroke="#c084fc" stroke-width="1.5"/>
    
    <!-- Shield Icon Path -->
    <path d="M65 42 L85 52 V68 C85 82 76 92 65 97 C54 92 45 82 45 68 V52 Z" fill="#a855f7" fill-opacity="0.3" stroke="#a855f7" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Lock Keyhole -->
    <circle cx="65" cy="65" r="4" fill="#f43f5e"/>
    <path d="M65 67 V74" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="240" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#purple-glow)" letter-spacing="1">
    SENTINEL BACKEND
  </text>
  
  <text x="240" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
    Security Monitoring • REST Telemetry • Auth Core
  </text>

  <!-- Tag Badges -->
  <g transform="translate(240, 180)">
    <rect width="80" height="28" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
    <text x="40" y="18" font-family="monospace" font-size="12" fill="#c084fc" font-weight="600" text-anchor="middle">NODE.JS</text>
  </g>
  <g transform="translate(330, 180)">
    <rect width="80" height="28" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
    <text x="40" y="18" font-family="monospace" font-size="12" fill="#c084fc" font-weight="600" text-anchor="middle">EXPRESS</text>
  </g>
  <g transform="translate(420, 180)">
    <rect width="90" height="28" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
    <text x="45" y="18" font-family="monospace" font-size="12" fill="#c084fc" font-weight="600" text-anchor="middle">SECURITY</text>
  </g>
</svg>
