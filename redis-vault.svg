<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d18"/>
      <stop offset="50%" stop-color="#1c0e18"/>
      <stop offset="100%" stop-color="#2a0d18"/>
    </linearGradient>
    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#ff7b54"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="280" rx="16" fill="url(#bg)" stroke="#3f1620" stroke-width="2"/>
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#ff4b4b" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="500" y1="0" x2="500" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="700" y1="0" x2="700" y2="280"/>
  </g>

  <!-- Glowing Vault / Redis Database Cylinder Icon -->
  <g transform="translate(70, 75)">
    <!-- Outer Glow Circle -->
    <circle cx="65" cy="65" r="55" fill="#ff4b4b" fill-opacity="0.1" stroke="#ff4b4b" stroke-width="2" filter="url(#glow)"/>
    <circle cx="65" cy="65" r="45" fill="#140a12" stroke="#ff6b6b" stroke-width="1.5"/>
    
    <!-- Database / Vault Layered Icon -->
    <ellipse cx="65" cy="48" rx="22" ry="8" fill="#ff4b4b" fill-opacity="0.25" stroke="#ff4b4b" stroke-width="2"/>
    <path d="M43 48 V62 C43 66.5 52.8 70 65 70 C77.2 70 87 66.5 87 62 V48" fill="none" stroke="#ff4b4b" stroke-width="2"/>
    <path d="M43 62 V76 C43 80.5 52.8 84 65 84 C77.2 84 87 80.5 87 76 V62" fill="none" stroke="#ff4b4b" stroke-width="2"/>
    <!-- Vault Key Lock Notch -->
    <circle cx="65" cy="62" r="3" fill="#ff7b54"/>
  </g>

  <!-- Typography -->
  <text x="240" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="url(#red-glow)" letter-spacing="1">
    MICRO-REDIS VAULT
  </text>
  
  <text x="240" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
    In-Memory Key-Value Store • Dynamic Memory Scrubbing
  </text>

  <!-- Tag Badges -->
  <g transform="translate(240, 180)">
    <rect width="90" height="28" rx="6" fill="#ff4b4b" fill-opacity="0.15" stroke="#ff4b4b" stroke-width="1"/>
    <text x="45" y="18" font-family="monospace" font-size="12" fill="#ff6b6b" font-weight="600" text-anchor="middle">C/PYTHON</text>
  </g>
  <g transform="translate(340, 180)">
    <rect width="105" height="28" rx="6" fill="#ff4b4b" fill-opacity="0.15" stroke="#ff4b4b" stroke-width="1"/>
    <text x="52.5" y="18" font-family="monospace" font-size="12" fill="#ff6b6b" font-weight="600" text-anchor="middle">IN-MEMORY</text>
  </g>
  <g transform="translate(455, 180)">
    <rect width="95" height="28" rx="6" fill="#ff4b4b" fill-opacity="0.15" stroke="#ff4b4b" stroke-width="1"/>
    <text x="47.5" y="18" font-family="monospace" font-size="12" fill="#ff6b6b" font-weight="600" text-anchor="middle">SECURITY</text>
  </g>
</svg>
