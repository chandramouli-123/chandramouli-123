<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="280" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Grid Accent Pattern -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="500" y1="0" x2="500" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="700" y1="0" x2="700" y2="280"/>
  </g>

  <!-- Glowing Icon Graphic (Spider/Scraper/AI Bot) -->
  <g transform="translate(70, 75)">
    <!-- Outer Glow Circle -->
    <circle cx="65" cy="65" r="55" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <circle cx="65" cy="65" r="45" fill="#0a0f1d" stroke="#4facfe" stroke-width="1.5"/>
    
    <!-- Scraper/Bot Icon Path -->
    <path d="M45 65 H85 M65 45 V85 M50 50 L80 80 M50 80 L80 50" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="65" cy="65" r="14" fill="#00f2fe"/>
    <circle cx="65" cy="65" r="6" fill="#0a0f1d"/>
  </g>

  <!-- Typography -->
  <text x="240" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#cyan-glow)" letter-spacing="1">
    AI WEB SCRAPER
  </text>
  
  <text x="240" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
    Automated Headless Extraction • Selenium • LLM Parser
  </text>

  <!-- Tag Badges -->
  <g transform="translate(240, 180)">
    <rect width="80" height="28" rx="6" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="1"/>
    <text x="40" y="18" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="600" text-anchor="middle">PYTHON</text>
  </g>
  <g transform="translate(330, 180)">
    <rect width="90" height="28" rx="6" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="1"/>
    <text x="45" y="18" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="600" text-anchor="middle">SELENIUM</text>
  </g>
  <g transform="translate(430, 180)">
    <rect width="100" height="28" rx="6" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="1"/>
    <text x="50" y="18" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="600" text-anchor="middle">LLM PARSE</text>
  </g>
</svg>
